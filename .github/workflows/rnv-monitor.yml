name: RNV Dienstplan Monitor

on:
  workflow_dispatch:
  schedule:
    # UTC 06:00-16:59 (= 07:00-17:59 Berlin im Winter), bewusst "krumme" Minuten
    - cron: "7,22,37,52 6-16 * * *"

concurrency:
  group: rnv-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Git konfigurieren
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main

      - name: Run monitor
        env:
          RNV_USER: ${{ secrets.RNV_USER }}
          RNV_PASS: ${{ secrets.RNV_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOPIC_MAMA: ${{ secrets.NTFY_TOPIC_MAMA }}
        run: python monitor.py

      - name: Run Dienst-Übersicht
        env:
          RNV_USER: ${{ secrets.RNV_USER }}
          RNV_PASS: ${{ secrets.RNV_PASS }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python dienst_uebersicht.py

      - name: Commit changes
        if: always()
        run: |
          git add checkpoint.json dienstplan.ics dienste/ 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Update Dienstplan, Übersicht und Checkpoint"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              sleep 5
            done
          else
            echo "Keine Änderungen."
          fi
